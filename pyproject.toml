#
# Use this configuration file to control what RobotPy packages are installed
# on your robot
#

[tool.robotpy]

# Version of robotpy this project depends on
robotpy_version = "2027.0.0a8"

# Which optional robotpy components should be installed?
# -> equivalent to `pip install robotpy[extra1, ...]
components = [
    # "all",
    # "apriltag",
    # "commands2",
    # "cscore",
    # "romi",
    # "sim",
    # "xrp",
]

# Other pip packages to install (including vendor packages)
requires = [
    "commands3 @ git+https://github.com/zachwaffle4/commandsv3-python.git@94d446a7802de31290781259d2c44f4787559158",
    "phoenix6~=26.70a2",
    # "photonlibpy",
    # "robotpy-ctre",  # Phoenix 5
    # "robotpy-navx",
    # "robotpy-pathplannerlib",
    # "robotpy-playingwithfusion",
    # "robotpy-rev",
    # "sleipnirgroup-choreolib",
]

[tool.uv.sources]
commands3 = { git = "https://github.com/zachwaffle4/commandsv3-python.git", rev = "94d446a7802de31290781259d2c44f4787559158" }

[project]
name = "pypotatocore"
version = "0.0.0"
description = "Python code to run potatobot on SystemCore"
authors = [{ name = "The Drop Bears", email = "enquiries@thedropbears.org.au" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.15,<3.16"

dependencies = [
    "commands3",
    "phoenix6~=26.70a2",
    "robotpy==2027.0.0a8",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
]

[tool.mypy]
follow_untyped_imports = true
